<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        header {
            background-color: #E6ACC9;
            color: #451123;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        main {
            background-color: #451123;
            color: #E6ACC9;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }
        article{
            display: flex;
        }

        img {
            width: 80px;
            height: 80px;
        }

        .artigo-autor {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <h1>ConceitoChique</h1>
        <p>Vou compartilhar ideias de roupas</p>
    </header>
    <main>
        <article>

            <img src="imagem-blog.png"
                alt="Ilustração em estilo clean de um look casual com um moletom rosa texturizado e uma calça jeans azul, ambos pendurados em cabides de madeira. Ao fundo, detalhes sutis de cabides e elementos que remetem a ideias de moda.">
            <div>
                <h2>Meu primeiro post</h2>
                <p class="artigo-autor">Maysa Marcuzzi</p>
                <p>Inspire-se com combinações criadas especialmente para você!</p>
                <button>🛍 <span>0</span></button>
                <button>🛒 <span>0</span></button>
            </div>
        </article>
        <article>

            <img src="imagem-blog.png"
                alt="Ilustração em estilo clean de um look casual com um moletom rosa texturizado e uma calça jeans azul, ambos pendurados em cabides de madeira. Ao fundo, detalhes sutis de cabides e elementos que remetem a ideias de moda.">
            <div>
                <h2>Meu segundo post</h2>
                <p class="artigo-autor">Maysa Marcuzzi</p>
                <p>Inspire-se com combinações criadas especialmente para você!</p>
                <button>🛍 <span>0</span></button>
                <button>🛒 <span>0</span></button>
            </div>
        </article>
    </main>
</body>
<script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function (botao) {
        botao.addEventListener("click", botaoClicado);
        function botaoClicado() {
            console.log("fui clicado");
            let texto = botao.querySelector("span");
            texto.textContent++;
        }

    })
        .


</script>

</html>
